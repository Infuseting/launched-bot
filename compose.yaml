services:
  bot:
    build: .
    container_name: launched_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - launched-bot-net
      - npm-network
    ulimits:
      core:
        soft: 0
        hard: 0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:4.4
    container_name: launched_bot_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changethispassword123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-discordbot}
    volumes:
      - mongo_data:/data/db
    networks:
      - launched-bot-net
    ulimits:
      core:
        soft: 0
        hard: 0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:

networks:
  launched-bot-net:
    driver: bridge
  npm-network:
    external: true
